[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemanager"
version = "0.1.0"
description = "Local repository graph and budgeted code retrieval for coding agents"
requires-python = ">=3.11"
dependencies = ["fastembed>=0.9.1,<1"]

[project.scripts]
codemanager = "codemanager.__main__:main"

[tool.setuptools.packages.find]
include = ["codemanager*"]
